[package]
name = "week_3_assignment_amm"
version = "0.1.0"
description = "Created with Anchor"
edition.workspace = true
# rust-version.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "week_3_assignment_amm"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []


[dependencies]
anchor-lang = { version = "1.2.2", features = ["init-if-needed"] }
anchor-spl = { version = "1.2.2", features = ["token", "associated_token"] }
constant-product-curve = { git = "https://github.com/deanmlittle/constant-product-curve.git" }

[dev-dependencies]
# Cargo.lock pins LiteSVM's Rust-1.89-compatible dependency graph.
litesvm = "0.18.2"
solana-message = "4"
solana-transaction = "4"
solana-signer = "3"
solana-keypair = "3"
solana-account = "4"
solana-pubkey = "4"


[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
  'cfg(target_os, values("solana"))',
] }
